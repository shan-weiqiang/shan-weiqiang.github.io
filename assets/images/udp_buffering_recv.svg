<svg xmlns="http://www.w3.org/2000/svg" width="760" height="409" viewBox="0 0 760 409" role="img" aria-labelledby="title"><title id="title">UDP kernel buffering: receiver</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs><style>text {font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill:#1e293b; font-size:12px; text-anchor:middle} .title {font-size:16px;font-weight:600} .note {font-size:11px;fill:#64748b}</style><rect width="100%" height="100%" fill="white"/>
<text x="380.0" y="34" class="title">UDP kernel buffering: receiver</text>
<rect x="25" y="60" width="710" height="54" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
<text x="380.0" y="82.2" class="">NIC RX ring / driver processing</text>
<text x="380.0" y="100.2" class="">Frames arrive; link and IP processing follow</text>
<path d="M380,119 L380,129" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="25" y="140" width="710" height="54" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
<text x="380.0" y="162.2" class="">IPv4 fragment reassembly (only for fragmented packets)</text>
<text x="380.0" y="180.2" class="">Shared within the network namespace; missing fragment prevents delivery</text>
<path d="M380,199 L380,209" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="25" y="220" width="710" height="54" rx="7" fill="#d1fae5" stroke="#22c55e"/>
<text x="380.0" y="242.2" class="">UDP socket receive queue (SO_RCVBUF)</text>
<text x="380.0" y="260.2" class="">Complete datagrams A, B, C; boundaries remain separate</text>
<path d="M380,279 L380,289" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="25" y="300" width="710" height="54" rx="7" fill="#dbeafe" stroke="#3b82f6"/>
<text x="380.0" y="322.2" class="">Application: one ordinary recvfrom() consumes one datagram</text>
<text x="380.0" y="340.2" class="">A short application buffer discards the remainder of that datagram</text>
</svg>
