<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if page.wide_layout %} class="wide-layout"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper{% if page.wide_layout %} wrapper--wide{% endif %}">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    {%- include custom-head.html -%}

  </body>

</html>
